[package]
name = "k3ncrypt-android-crypto"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
jni = "0.21"
once_cell = "1.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
vodozemac = { version = "=0.11.0", default-features = false, features = ["precomputed-tables"] }
zeroize = "1.8"
