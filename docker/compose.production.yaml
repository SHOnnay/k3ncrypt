services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?required}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/admin | grep 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file: ../.env.production
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        CHATE2EE_API_URL: ${CHATE2EE_API_URL:?required}
        CHATE2EE_ICE_SERVERS: ${CHATE2EE_ICE_SERVERS:-[]}
        CHATE2EE_ICE_TRANSPORT_POLICY: ${CHATE2EE_ICE_TRANSPORT_POLICY:-all}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  mongo_data:
