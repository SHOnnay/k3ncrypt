# Backend + Web assets. MongoDB and TLS proxy are operator-managed services.
services:
  app:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      args:
        CHATE2EE_API_URL: ${CHATE2EE_API_URL:-}
        CHATE2EE_ICE_SERVERS: ${CHATE2EE_ICE_SERVERS:-[]}
        CHATE2EE_ICE_TRANSPORT_POLICY: ${CHATE2EE_ICE_TRANSPORT_POLICY:-all}
    env_file: ${K3NCRYPT_ENV_FILE:?Set an external production environment file}
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
