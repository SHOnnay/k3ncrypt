[package]
name = "k3ncrypt-vodozemac"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
vodozemac = { version = "=0.11.0", default-features = false, features = ["precomputed-tables", "wasm_js"] }
wasm-bindgen = "0.2"
zeroize = "1.8"

[dev-dependencies]
serde_json = "1.0"
